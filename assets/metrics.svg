<svg xmlns="http://www.w3.org/2000/svg" width="880" height="104" viewBox="0 0 880 104" role="img" aria-label="Outcomes: 7+ years of professional work; 1,500+ developers mentored; 30% workflow efficiency gain; 35% vulnerabilities reduced">
  <style>
  :root{
    --ink:#171a2f;
    --surface:#222640;
    --text:#f6f7ff;
    --secondary:#b4bad8;
    --muted:#8f96ba;
    --rule:#343a5f;
    --signal:#ffcc68;
    --paper:#f6f3ea;
    --paper-surface:#fffaf0;
    --ink-text:#121827;
    --paper-rule:#ddd3c2;
    --paper-signal:#8d3d1f;
  }
  @media (prefers-color-scheme: light){
    :root{
      --ink:#f6f3ea;
      --surface:#fffaf0;
      --text:#121827;
      --secondary:#5a5f70;
      --muted:#666c7d;
      --rule:#ddd3c2;
      --signal:#8d3d1f;
    }
  }
    .v{font-family:'Muli', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:34px;font-weight:800;fill:var(--signal)}
    .l{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;font-weight:700;letter-spacing:0.12em;fill:var(--text)}
    .s{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;font-weight:400;letter-spacing:0.02em;fill:var(--muted)}
    .r{stroke:var(--rule);stroke-width:1}
  </style>
  <line class="r" x1="0" y1="0.5" x2="880" y2="0.5"/>
  
  <text class="v" x="0" y="46">7+</text>
  <text class="l" x="0" y="70">YEARS OF</text>
  <text class="s" x="0" y="86">professional work</text>
  <line class="r" x1="220" y1="18" x2="220" y2="88"/>
  <text class="v" x="244" y="46">1,500+</text>
  <text class="l" x="244" y="70">DEVELOPERS</text>
  <text class="s" x="244" y="86">mentored</text>
  <line class="r" x1="440" y1="18" x2="440" y2="88"/>
  <text class="v" x="464" y="46">30%</text>
  <text class="l" x="464" y="70">WORKFLOW</text>
  <text class="s" x="464" y="86">efficiency gain</text>
  <line class="r" x1="660" y1="18" x2="660" y2="88"/>
  <text class="v" x="684" y="46">35%</text>
  <text class="l" x="684" y="70">VULNERABILITIES</text>
  <text class="s" x="684" y="86">reduced</text>
  <line class="r" x1="0" y1="103.5" x2="880" y2="103.5"/>
</svg>
