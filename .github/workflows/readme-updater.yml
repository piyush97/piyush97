name: Update README

# Disabled automatically after the profile README redesign. The activity feed
# is intentionally replaced by curated project evidence.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update this repo's README with recent activity

    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GH }}
